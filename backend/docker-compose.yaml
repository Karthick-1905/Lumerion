services:
  minio:
    image: quay.io/minio/minio:latest

    container_name: notes_storage
    volumes:
      - ./data:/data    
    environment:
      MINIO_ROOT_USER: 'admin'
      MINIO_ROOT_PASSWORD: 'admin123'
      MINIO_ADDRESS: ':9000'
      MINIO_CONSOLE_ADDRESS: ':9001'
    command: minio server /data
    ports:
      - "9000:9000"
      - "9001:9001"